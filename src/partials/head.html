    <style>
        /* Clean, Bright & Airy Corporate B2B Light Theme */
        body {
            background-color: #ffffff;
            color: #0f172a;
            overflow-x: hidden;
        }
        
        .bg-grid-light {
            background-image: 
                linear-gradient(to right, rgba(15, 23, 42, 0.035) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(15, 23, 42, 0.035) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .clean-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.04), 0 4px 12px -2px rgba(15, 23, 42, 0.02);
        }

        .clean-card-hover {
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .clean-card-hover:hover {
            transform: translateY(-4px);
            border-color: #93c5fd;
            box-shadow: 0 20px 35px -10px rgba(15, 23, 42, 0.08), 0 8px 16px -4px rgba(29, 78, 216, 0.06);
        }

        /* Ticker Animation */
        @keyframes ticker {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .animate-ticker {
            display: flex;
            width: max-content;
            animation: ticker 38s linear infinite;
        }
        .animate-ticker:hover {
            animation-play-state: paused;
        }

        /* Subtle Pulse for WhatsApp Floating CTA */
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6); }
            70% { transform: scale(1); box-shadow: 0 0 0 14px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        .whatsapp-pulse {
            animation: pulse-ring 2.5s infinite;
        }
    </style>
